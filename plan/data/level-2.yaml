- code: B203
  title: Marketing Analytics & Experimentation
  level: 2
  lane: B
  kind: full
  prereqs: [S101, B101]
  resources: "Kohavi, Tang & Xu, Trustworthy Online Controlled Experiments"
  assessment:
    - {label: "Timed case rubric", url: "https://github.com/imjbmkz/bsban-acs/blob/main/templates/assessment-rubrics.md#timed-case"}
  units:
    - learn: "Funnel metrics and customer journeys"
      apply: "Build a funnel from event data"
    - learn: "Customer lifetime value"
      apply: "CLV with a BG/NBD model (lifetimes or PyMC-Marketing)"
    - learn: "Attribution models"
      apply: "Compare last-touch and Markov-chain attribution"
    - learn: "Experiment design and the overall evaluation criterion"
      apply: "Experiment design doc for a real feature"
    - learn: "Randomization, sample ratio mismatch, guardrails"
      apply: "Simulate an A/B test and detect SRM"
    - learn: "Analysis: variance, CUPED, novelty effects"
      apply: "Apply CUPED and report the variance reduction"
    - learn: "Pitfalls: peeking, many metrics, interference"
      apply: "Simulate the false-positive rate of peeking"
    - learn: "Experimentation culture and decision memos"
      apply: "Write a decision memo template"
  build: "Simulated A/B test with a full analysis notebook"
  memo: "Go/no-go recommendation on a campaign"
  exam: "Timed case: analyze a provided experiment dataset and recommend in 90 minutes"
