  prereqs: [S202]
  resources: "Montgomery, Introduction to Statistical Quality Control; Montgomery, Design and Analysis of Experiments"
  domain: statistics
  assessment:
    - {label: "Textbook timed-set rubric", url: "https://github.com/imjbmkz/bsban-acs/blob/main/templates/assessment-rubrics.md#textbook-timed-set"}
  units:
    - learn: "Quality, variation and process capability"
      apply: "Capability indices for a process metric"
    - learn: "Control charts for variables (X-bar, R, S)"
      apply: "Control charts for pipeline run times"
    - learn: "Control charts for attributes (p, c, u)"
      apply: "Defect-rate chart for data quality checks"
    - learn: "CUSUM and EWMA charts"
      apply: "Detect small shifts in a KPI"
    - learn: "Factorial designs"
      apply: "2^k design for a process-tuning experiment"
    - learn: "Fractional factorials and blocking"
      apply: "Screening experiment design"
    - learn: "Response surface methods"
      apply: "Optimize two settings with RSM"
    - learn: "Lean Six Sigma and DMAIC"
      apply: "DMAIC write-up of a real process issue"
  build: "SPC monitoring toolkit and a designed experiment"
  memo: "Process improvement recommendation for an operations manager"
  exam: "Montgomery problems, 2-hour timed set"

# ---------- Track B: MS Computer Science + statistics ----------

- code: B1
  title: Advanced Algorithm Design
  level: 4
  lane: elective
  kind: full
  prereqs: [C201]
  resources: "Kleinberg & Tardos, Algorithm Design"
  domain: computer_science
  assessment:
    - {label: "Princeton COS 226 past exams (algorithm design sections)", url: "https://www.cs.princeton.edu/courses/archive/fall13/cos226/exams.php"}
    - {label: "Textbook timed-set rubric", url: "https://github.com/imjbmkz/bsban-acs/blob/main/templates/assessment-rubrics.md#textbook-timed-set"}
  units:
    - learn: "Greedy algorithms and exchange arguments"
      apply: "Interval scheduling with proofs"
    - learn: "Divide and conquer, recurrences"
      apply: "Closest pair and counting inversions"
    - learn: "Dynamic programming, advanced"
      apply: "Sequence alignment for fuzzy record matching"
    - learn: "Network flow"
      apply: "Bipartite matching for resource allocation"
    - learn: "NP-completeness and reductions"
      apply: "Reduction proofs"
    - learn: "Approximation algorithms"
      apply: "Approximate set cover for sensor placement"
    - learn: "Randomized algorithms"
      apply: "Reservoir sampling and MinHash"
    - learn: "Streaming and sketching algorithms"
      apply: "HyperLogLog and Count-Min sketch from scratch"
  build: "Sketching library (MinHash, HyperLogLog, Count-Min) with error analysis"
  memo: "Approximate answers at a fraction of the cost: when to use them"
  exam: "Kleinberg & Tardos problems, 2-hour timed set"

- code: B2
