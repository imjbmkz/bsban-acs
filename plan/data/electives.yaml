# Level 4 track electives. Pick one track in plan/config.yaml (A, B or C).
# Track A minors: swap A3-A5 for courses in your minor (economics, finance or industrial engineering).

# ---------- Track A: MS Statistics + domain minor ----------

- code: A1
  title: Real Analysis I
  level: 4
  lane: elective
  kind: full
  prereqs: [M103, M201]
  resources: "Abbott, Understanding Analysis; MIT OCW 18.100A (free)"
  domain: mathematics
  assessment:
    - {label: "MIT 18.100A (Fall 2020) midterm", url: "https://ocw.mit.edu/courses/18-100a-real-analysis-fall-2020/pages/exams/"}
  units:
    - learn: "Real numbers, completeness, the axiom of completeness"
      apply: "Prove five completeness results in writing"
    - learn: "Sequences and limits; epsilon-N proofs"
      apply: "Epsilon-N proofs for sequences you met in M201"
    - learn: "Monotone convergence, Bolzano-Weierstrass, Cauchy sequences"
      apply: "Proof set; explain why iterative algorithms converge"
    - learn: "Series and convergence"
      apply: "Rigorous versions of the M201 convergence tests"
    - learn: "Topology of the real line: open, closed, compact sets"
      apply: "Proof set"
    - learn: "Continuity and uniform continuity"
      apply: "Epsilon-delta proofs; link to numerical stability"
    - learn: "Differentiation and the mean value theorem, rigorously"
      apply: "Proof set"
    - learn: "Sequences of functions, uniform convergence; Riemann integral"
      apply: "Proof set; summarize why this matters for asymptotic statistics"
  build: "Typeset proof portfolio (Markdown + LaTeX) of 40 graded proofs"
  memo: "Why rigor matters in model guarantees: a note for a non-technical manager"
  exam: "MIT 18.100A past exam (timed)"

- code: A2
  title: Stochastic Processes
  level: 4
  lane: elective
  kind: full
  prereqs: [S201]
  resources: "Ross, Introduction to Probability Models"
  domain: statistics
  assessment:
    - {label: "MIT 6.262 past midterms and finals with solutions", url: "https://ocw.mit.edu/courses/6-262-discrete-stochastic-processes-spring-2011/pages/exams/"}
  units:
    - learn: "Review of conditional probability and expectation"
      apply: "Problem set"
    - learn: "Discrete-time Markov chains"
      apply: "Customer state transition model from event data"
    - learn: "Stationary distributions and long-run behavior"
      apply: "Long-run share of active, dormant and churned customers"
    - learn: "Absorbing chains and first-passage times"
      apply: "Expected time to churn"
    - learn: "Poisson processes"
      apply: "Simulate arrivals and check against theory"
    - learn: "Continuous-time Markov chains"
      apply: "Machine up/down availability model"
    - learn: "Renewal theory"
      apply: "Maintenance replacement policy"
    - learn: "Queueing models as stochastic processes; intro to Brownian motion"
      apply: "Simulate a random walk price path"
  build: "Markov-chain customer lifecycle model with simulation"
  memo: "Long-run customer mix and its revenue implications"
  exam: "Ross end-of-chapter problems, 2-hour timed set"

- code: A3
  title: Econometrics
  level: 4
  lane: elective
  kind: full
  prereqs: [S302]
  resources: "Wooldridge, Introductory Econometrics: A Modern Approach"
  domain: business_and_economics
  assessment:
    - {label: "Textbook timed-set rubric", url: "https://github.com/imjbmkz/bsban-acs/blob/main/templates/assessment-rubrics.md#textbook-timed-set"}
  units:
    - learn: "Econometric thinking and OLS assumptions"
      apply: "Replicate a textbook wage regression"
    - learn: "Inference and asymptotics in OLS"
      apply: "Robust inference on that model"
    - learn: "Specification, functional form, proxies"
      apply: "Specification tests"
    - learn: "Heteroskedasticity and serial correlation"
      apply: "Diagnose and correct both"
    - learn: "Panel data: fixed and random effects"
      apply: "Panel model on regional data"
    - learn: "Instrumental variables and 2SLS"
      apply: "2SLS estimate with weak-instrument checks"
    - learn: "Limited dependent variables: probit, logit, Tobit"
      apply: "Probit model of a binary decision"
    - learn: "Time-series regression basics"
      apply: "Distributed lag model of advertising"
  build: "Panel or IV study on Philippine regional data"
  memo: "A policy or pricing question answered with econometric evidence"
  exam: "Wooldridge problems, 2-hour timed set"

- code: A4
  title: Financial Econometrics & Risk
  level: 4
  lane: elective
  kind: full
  prereqs: [S304]
  resources: "Tsay, Analysis of Financial Time Series; Hull, Risk Management and Financial Institutions"
  domain: statistics
  assessment:
    - {label: "Textbook timed-set rubric", url: "https://github.com/imjbmkz/bsban-acs/blob/main/templates/assessment-rubrics.md#textbook-timed-set"}
  units:
    - learn: "Returns, stylized facts of financial data"
      apply: "Analyze PSEi or global index returns"
    - learn: "ARMA models for returns"
      apply: "Fit and test ARMA on returns"
    - learn: "Volatility: ARCH and GARCH"
      apply: "GARCH volatility forecast"
    - learn: "Value at risk and expected shortfall"
      apply: "Historical, parametric and Monte Carlo VaR"
    - learn: "Backtesting risk models"
      apply: "Kupiec test on your VaR"
    - learn: "Multivariate models and correlation"
      apply: "Portfolio covariance estimation"
    - learn: "Credit risk basics"
      apply: "Probability-of-default scorecard"
    - learn: "Stress testing and model risk"
      apply: "Stress scenario report"
  build: "VaR and expected-shortfall engine with backtests"
  memo: "Risk report for an investment committee"
  exam: "Tsay and Hull problems, 2-hour timed set"

- code: A5
