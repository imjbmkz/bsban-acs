# Level 1 — Foundations. One entry per course.
# kind: full (8 study weeks + 1 final week) | test-out (2 weeks + sign-off week)
# Each unit is one week in its lane (~5 h): "learn" is theory, "apply" is the hands-on task.

- code: M101
  title: Precalculus & Mathematical Reasoning
  level: 1
  lane: A
  kind: full
  prereqs: []
  resources: "OpenStax Precalculus 2e (free); Khan Academy Precalculus"
  units:
    - learn: "Functions, domain and range, composition, transformations"
      apply: "Plot families of functions with matplotlib; write helpers that shift and scale any f(x)"
    - learn: "Linear and quadratic functions; systems of equations"
      apply: "Fit a linear cost model to monthly spend data and solve for break-even volume"
    - learn: "Polynomial and rational functions, asymptotes"
      apply: "Model average cost per unit (fixed/x + variable) and find where it flattens"
    - learn: "Exponential and logarithmic functions, log rules"
      apply: "Fit exponential user growth with a log-linear fit in NumPy; report the doubling time"
    - learn: "Compound interest, the number e, continuous growth and decay"
      apply: "Build a loan and savings calculator comparing compounding frequencies"
    - learn: "Trigonometry essentials: unit circle, sine and cosine, periodic functions"
      apply: "Model seasonal sales with a sine term and overlay it on real monthly data"
    - learn: "Sequences, series, sigma notation, geometric series"
      apply: "Compute cumulative retention and customer value as a geometric series"
    - learn: "Inequalities, absolute value, mathematical notation and first proofs"
      apply: "Rewrite five KPI definitions from work in precise math notation"
  build: "Growth-curves notebook fitting linear, exponential and seasonal models to a public sales or population dataset"
  memo: "How compounding growth, interest and churn change a small business's 3-year outlook"
  exam: "Khan Academy Precalculus course challenge plus OpenStax chapter review tests (90 min, timed)"

- code: M102
  title: Calculus I
  level: 1
  lane: A
  kind: full
  prereqs: [M101]
  resources: "MIT OCW 18.01SC Single Variable Calculus; OpenStax Calculus Vol. 1 (free)"
  units:
    - learn: "Limits and continuity"
      apply: "Estimate limits numerically in Python; find where a tiered pricing function is discontinuous"
    - learn: "Derivative definition; power, product and quotient rules"
      apply: "Implement a finite-difference derivative and compare it with analytic results"
    - learn: "Chain rule, implicit differentiation, derivatives of exp and log"
      apply: "Derive and code marginal revenue for a fitted demand curve"
    - learn: "Related rates and linear approximation"
      apply: "Approximate the revenue effect of a 1% price change and check it against the exact value"
    - learn: "Optimization, extrema, curve sketching"
      apply: "Find the profit-maximizing price for a fitted demand and cost curve"
    - learn: "Mean value theorem, L'Hopital's rule, Newton's method"
      apply: "Implement Newton's method to solve break-even and rate-of-return equations"
    - learn: "Riemann sums and the Fundamental Theorem of Calculus"
      apply: "Code trapezoid and Riemann integrators; total revenue from a marginal revenue curve"
    - learn: "Substitution, area between curves, average value"
      apply: "Compute consumer surplus from a demand curve and average daily load from a usage curve"
  build: "numcalc: a tested Python module for numerical derivatives, root finding and integration"
  memo: "Pricing recommendation from marginal cost and marginal revenue"
  exam: "MIT 18.01SC final exam (timed, closed book)"

- code: M103
  title: Discrete Math & Proofs
  level: 1
  lane: A
  kind: full
  prereqs: [M101]
  resources: "Hammack, Book of Proof (free); MIT OCW 6.042J Mathematics for Computer Science"
  units:
    - learn: "Propositional logic, truth tables, quantifiers"
      apply: "Express SQL WHERE clauses as logical statements and test equivalences in Python"
    - learn: "Sets, functions, relations"
      apply: "Model joins and set operations on sample tables; verify results in SQL"
    - learn: "Direct proof, contrapositive, contradiction"
      apply: "Write five short proofs and typeset them in Markdown with LaTeX"
    - learn: "Induction and strong induction"
      apply: "Prove a loop invariant for two of your own pipeline functions"
    - learn: "Counting: permutations, combinations, pigeonhole principle"
      apply: "Count partitioning and configuration options for a table design"
    - learn: "Inclusion-exclusion, binomial theorem, recurrence relations"
      apply: "Solve a recurrence for a work backlog that grows and drains each week"
    - learn: "Graphs: paths, trees, connectivity, DAGs"
      apply: "Build your data lineage as a networkx DAG and detect cycles"
    - learn: "Topological sort, shortest paths, matchings"
      apply: "Implement topological sort and Dijkstra; schedule jobs by dependency"
  build: "Lineage-graph tool that computes run order and downstream impact of a change"
  memo: "Capacity planning by counting scenarios: how many failure combinations must the platform handle?"
  exam: "MIT 6.042J sample final (timed)"

- code: S101
  title: Introduction to Statistics & Data Analysis
  level: 1
  lane: A
  kind: full
  prereqs: []
  resources: "OpenIntro Statistics (free)"
  units:
    - learn: "Data, study design, observational vs experimental, sampling bias"
      apply: "Critique the sampling behind one dataset you use at work"
    - learn: "Numerical and categorical summaries, distributions, visualization"
      apply: "EDA notebook on a public dataset (e.g., PSA OpenSTAT or a Kaggle retail dataset)"
    - learn: "Probability basics and conditional probability"
      apply: "Compute conversion probabilities by customer segment from data"
    - learn: "Normal and binomial distributions"
      apply: "Simulate both in NumPy and compare against the formulas"
    - learn: "Sampling distributions, central limit theorem, confidence intervals"
      apply: "Bootstrap vs formula confidence interval for average order value"
    - learn: "Hypothesis testing, p-values, type I and II errors"
      apply: "Test whether a sales uplift after a campaign is significant"
    - learn: "Inference for proportions and means: t-tests, chi-square"
      apply: "Two-sample t-test and chi-square test on segment data"
    - learn: "Simple and multiple linear regression"
      apply: "Regress sales on price and promotion; interpret each coefficient in plain words"
  build: "EDA and inference report on a public dataset, reproducible from a clean clone"
  memo: "Is the sales uplift real or noise? A recommendation to a sales manager"
  exam: "OpenIntro end-of-chapter exercises as a 2-hour timed practice exam"

- code: C101
  title: Programming Fundamentals (Python)
  level: 1
  lane: B
  kind: test-out
  prereqs: []
  resources: "Harvard CS50P (free); Python docs; pytest and mypy docs"
  units:
    - learn: "Self-assess against CS50P problem sets; fill gaps in typing, OOP and pytest"
      apply: "Refactor one work script into a typed, tested Python package"
    - learn: "Packaging, CLIs, docstrings and static type checks"
      apply: "Add a CLI, README and mypy-clean types; push to GitHub"
  signoff: "CS50P final project (or your package) on GitHub with tests passing"
  memo: "Reusable internal tool: who uses it and how much time it saves"

- code: C102
  title: Software Engineering Practices
  level: 1
  lane: B
  kind: full
  prereqs: [C101]
  resources: "MIT Missing Semester (free); GitHub Actions docs; pytest docs"
  units:
    - learn: "Shell, scripting and command-line tooling"
      apply: "Automate a local data task end to end with a bash script"
    - learn: "Git internals, branching, pull request workflow"
      apply: "Run this repo with branches and PRs for every course"
    - learn: "Testing: unit, integration and data quality tests"
      apply: "Write a pytest suite with data checks for a small pipeline"
    - learn: "Linting, formatting, type checking, pre-commit"
      apply: "Add ruff, mypy and pre-commit hooks to the pipeline"
    - learn: "Continuous integration with GitHub Actions"
      apply: "Workflow that runs lint and tests on every push and PR"
    - learn: "Environments, packaging, Docker basics"
      apply: "Containerize the pipeline and run it from the image"
    - learn: "Continuous delivery, semantic versioning, release practices"
      apply: "Tag-triggered release workflow that builds and publishes the image"
    - learn: "Code review and documentation; architecture decision records"
      apply: "Write a review checklist and two ADRs for the pipeline"
  build: "Data pipeline with tests, linting and a CI/CD workflow on GitHub Actions"
  memo: "Cost of defects and release risk: the business case for CI/CD on a client project"
  exam: "Practical: from a clean clone, fix a seeded bug and get CI green within 60 minutes"

- code: C103
  title: SQL & Dimensional Data Modeling
  level: 1
  lane: B
  kind: test-out
  prereqs: []
  resources: "Kimball, The Data Warehouse Toolkit; dbt Learn 'dbt Fundamentals' (free); DuckDB"
  units:
    - learn: "Kimball review: star schemas, grain, slowly changing dimensions, conformed dimensions"
      apply: "Design a star schema for a public retail dataset"
    - learn: "dbt fundamentals: sources, models, tests, documentation"
      apply: "dbt project on DuckDB (no cloud cost) with tests and generated docs"
  signoff: "dbt Fundamentals certificate plus the dbt project on GitHub"
  memo: "A KPI layer a finance team can trust: definitions, tests and ownership"

- code: B101
  title: Principles of Microeconomics
  level: 1
  lane: B
  kind: full
  prereqs: []
  resources: "CORE Econ, The Economy (free); MIT OCW 14.01"
  units:
    - learn: "Scarcity, opportunity cost, incentives"
      apply: "Opportunity-cost analysis of a real decision at work"
    - learn: "Demand, supply, equilibrium"
      apply: "Plot supply and demand curves from a public commodity dataset"
    - learn: "Elasticity"
      apply: "Estimate price elasticity from sales data with a log-log regression"
    - learn: "Consumer choice: utility and budget constraints"
      apply: "Model how customers choose between subscription tiers"
    - learn: "Production and cost curves"
      apply: "Fixed vs variable cost curves for a data platform"
    - learn: "Market structures: competition, monopoly, price discrimination"
      apply: "Analyze tiered pricing as price discrimination"
    - learn: "Game theory"
      apply: "Simulate a pricing game between two competitors"
    - learn: "Market failures and information asymmetry"
      apply: "Explain a lemons problem in a market you know"
  build: "Price-elasticity estimation notebook on real sales data"
  memo: "Pricing recommendation memo for a product owner"
  exam: "MIT 14.01 final exam (timed)"

- code: B102
  title: Financial Accounting
  level: 1
  lane: B
  kind: full
  prereqs: []
  resources: "OpenStax Principles of Accounting Vol. 1 (free)"
  units:
    - learn: "The accounting equation and double-entry bookkeeping"
      apply: "Build a mini general ledger in Python"
    - learn: "Income statement, accruals, revenue recognition"
      apply: "Generate an income statement from the ledger"
    - learn: "Balance sheet"
      apply: "Generate a balance sheet and check that it balances"
    - learn: "Cash flow statement (indirect method)"
      apply: "Derive cash flow from two balance sheets and an income statement"
    - learn: "Inventory costing and depreciation"
      apply: "Compare FIFO and weighted-average cost effects on profit"
    - learn: "Liabilities and equity"
      apply: "Model a loan and its effect on all three statements"
    - learn: "Ratio analysis: liquidity, profitability, leverage, efficiency"
      apply: "Parse a listed company's filings into a ratio table"
    - learn: "Reading an annual report end to end"
      apply: "Ten-minute health check of a listed company"
  build: "Ratio dashboard built from public filings"
  memo: "Read a company's financial health in ten minutes: a one-page verdict"
  exam: "OpenStax chapter review problems as a 2-hour timed exam"

- code: B103
  title: Structured Problem Solving & Business Communication
  level: 1
  lane: B
  kind: full
  prereqs: []
  resources: "Minto, The Pyramid Principle; Conn & McLean, Bulletproof Problem Solving"
  units:
    - learn: "Defining the problem: SMART questions, stakeholders, decision owners"
      apply: "Rewrite a vague request from work into a crisp problem statement"
    - learn: "Issue trees and MECE structuring"
      apply: "Issue tree for a real work problem"
    - learn: "Hypothesis-driven analysis and prioritization"
      apply: "Prioritized workplan for that problem"
    - learn: "Analysis planning and 80/20 thinking"
      apply: "Ghost deck: headlines first, analyses second"
    - learn: "Pyramid principle: governing thought, SCQA"
      apply: "Rewrite a long work email using SCQA"
    - learn: "Storylines and action titles"
      apply: "Five-slide storyline for a past project"
    - learn: "Data visualization for executives"
      apply: "Redesign three charts from your own dashboards"
    - learn: "Presenting and handling objections"
      apply: "Record a 5-minute presentation and critique it"
  build: "Consulting deck that retells one past work project as a recommendation"
  memo: "Executive summary that gets a decision"
  exam: "Timed case: 60 minutes to structure a provided problem and write an executive summary"
